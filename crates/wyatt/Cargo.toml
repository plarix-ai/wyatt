[package]
name = "wyatt"
description = "Runtime policy enforcement daemon and CLI for AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "wyatt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
wyatt-core = { path = "../wyatt-core" }
