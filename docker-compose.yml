version: "3.8"

services:
  opa:
    image: openpolicyagent/opa:latest
    container_name: wyatt-opa
    ports:
      - "8181:8181"
    volumes:
      - ./wyatt/policies:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    # Note: OPA container is distroless (no wget/curl/shell)
    # Health can be verified externally: curl http://localhost:8181/health
