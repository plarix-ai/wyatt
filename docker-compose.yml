version: "3.8"

services:
  opa:
    image: openpolicyagent/opa:latest
    container_name: wyatt-opa
    ports:
      - "8181:8181"
    volumes:
      - ./wyatt/policies:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8181/health"]
      interval: 5s
      timeout: 3s
      retries: 3
